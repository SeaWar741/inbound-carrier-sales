services:
  - type: web
    name: inbound-carrier-sales
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: OTP_DELIVERY_MODE
        value: demo
      - key: TMS_HOST
        sync: false
      - key: TMS_PORT
        sync: false
      - key: TMS_TOKEN
        sync: false
      - key: FMCSA_API_KEY
        sync: false
      - key: HAPPYROBOT_API_KEY
        sync: false
      # Trip estimates; without both the agent pitches loads without diesel, tolls or feasibility.
      # EIA: free key from the registration at https://www.eia.gov/opendata/register.php (api.eia.gov).
      - key: EIA_API_KEY
        sync: false
      # ORS: free Standard plan key from https://openrouteservice.org/dev/#/signup.
      - key: ORS_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: OPERATOR_API_KEY
        sync: false
      - key: OTP_DEMO_EMAIL
        sync: false
      - key: OTP_DEMO_PHONE
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: OTP_EMAIL_WORKFLOW_ID
        sync: false
      - key: OTP_SMS_WORKFLOW_ID
        sync: false
      - key: HAPPYROBOT_ENVIRONMENT
        value: development
      # Shared rate-limit counters, so any number of instances count together.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rate-limits
          property: connectionString
  # Free Key Value (Valkey): rate-limit counters only, nothing that must survive a restart.
  # The tower sets its own REDIS_URL to this instance's internal URL.
  - type: keyvalue
    name: rate-limits
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
