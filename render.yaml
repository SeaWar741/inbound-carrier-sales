services:
  - type: web
    name: inbound-carrier-sales
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: OTP_DELIVERY_MODE
        value: demo
      - key: TMS_HOST
        sync: false
      - key: TMS_PORT
        sync: false
      - key: TMS_TOKEN
        sync: false
      - key: FMCSA_API_KEY
        sync: false
      - key: HAPPYROBOT_API_KEY
        sync: false
      # Trip estimates; without both the agent pitches loads without diesel, tolls or feasibility.
      # EIA: free key from the registration at https://www.eia.gov/opendata/register.php (api.eia.gov).
      - key: EIA_API_KEY
        sync: false
      # ORS: free Standard plan key from https://openrouteservice.org/dev/#/signup.
      - key: ORS_API_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: OPERATOR_API_KEY
        sync: false
      - key: OTP_DEMO_EMAIL
        sync: false
      - key: OTP_DEMO_PHONE
        sync: false
      - key: OTP_HASH_SECRET
        sync: false
      - key: OTP_EMAIL_WORKFLOW_ID
        sync: false
      - key: OTP_SMS_WORKFLOW_ID
        sync: false
      - key: HAPPYROBOT_ENVIRONMENT
        value: development

  # The operator UI. Deployed here, next to the adapter, because importing it as a HappyRobot App was
  # refused (403) and HappyRobot advised an external deploy. One long-lived process keeps the live
  # transcript streams open as long as a call lasts.
  - type: web
    name: control-tower
    runtime: node
    plan: free
    rootDir: control-tower
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ADAPTER_URL
        value: https://inbound-carrier-sales-27mq.onrender.com
      - key: OPERATOR_PASSCODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPERATOR_API_KEY
        sync: false
      # Its own key: the public API allows 300 requests per minute per key.
      - key: HAPPYROBOT_API_KEY
        sync: false
      - key: WORKFLOW_ID
        sync: false
      - key: HAPPYROBOT_ENVIRONMENT
        value: development

